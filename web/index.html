<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>當前應用效能管家</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

<main class="guardian">

    <header class="topbar">

        <div>
            <div class="eyebrow">
                CURRENT APP GUARDIAN
            </div>

            <h1>
                當前應用效能管家
            </h1>

            <p>
                安靜監測，異常時保存證據。
            </p>
        </div>

        <div
            id="guardianStatus"
            class="status online"
        >
            Web 管家運作中
        </div>

    </header>

    <section class="panel current-app">

        <div class="section-title">
            目前 App
        </div>

        <div
            id="currentAppName"
            class="value"
        >
            此頁面
        </div>

        <div
            id="currentAppType"
            class="subvalue"
        >
            Web App
        </div>

    </section>

    <section class="grid">

        <article class="metric">
            <span>FPS</span>
            <strong id="fpsValue">
                --
            </strong>
        </article>

        <article class="metric">
            <span>Frame Time</span>
            <strong id="frameTimeValue">
                --
            </strong>
        </article>

        <article class="metric">
            <span>Latency</span>
            <strong id="latencyValue">
                --
            </strong>
        </article>

        <article class="metric">
            <span>Jitter</span>
            <strong id="jitterValue">
                --
            </strong>
        </article>

        <article class="metric">
            <span>WebSocket</span>
            <strong id="socketValue">
                --
            </strong>
        </article>

        <article class="metric">
            <span>黑盒狀態</span>
            <strong id="blackboxValue">
                ACTIVE
            </strong>
        </article>

    </section>

    <section class="panel">

        <div class="section-title">
            即時事件
        </div>

        <div
            id="eventTimeline"
            class="timeline"
        ></div>

    </section>

    <section class="actions">

        <button
            id="markButton"
            type="button"
        >
            標記目前事件
        </button>

        <button
            id="exportButton"
            type="button"
        >
            匯出事故黑盒
        </button>

        <button
            id="clearButton"
            type="button"
        >
            清除本地紀錄
        </button>

    </section>

</main>

<script
    src="./guardian.js"
    defer
></script>

</body>
</html>
